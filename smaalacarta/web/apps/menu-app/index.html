    <!-- Tema del loader (PUBLICO-85): el último que tuvo este menú, antes de que llegue la configuración -->
    <script type="module">
      import { loaderThemeKey, savedLoaderTheme } from "/apps/menu-app/lib/theme.js";
      import { resolveTarget } from "/apps/menu-app/lib/hostname.js";
      import { applyLoaderAnimation, savedLoaderLook } from "/apps/menu-app/lib/loader.js";
      try {
        const key = loaderThemeKey(location.hostname, location.pathname, location.search);
        const saved = savedLoaderTheme(window.localStorage, key);
        if (saved) document.documentElement.dataset.tema = saved;
        // La última animación de carga de este menú, para verla de entrada y no una pantalla vacía.
        const look = savedLoaderLook(window.localStorage, key);
        if (look) applyLoaderAnimation(look);

        // Se pide el menú ya, en paralelo con la carga del resto del código, así la animación elegida llega antes
        // (la primera vez no hay una recordada). app.js reutiliza esta misma respuesta.
        const target = resolveTarget({ hostname: location.hostname, search: location.search });
        if (target?.type === "cliente" && !new URLSearchParams(location.search).get("preview")) {
          const promise = Promise.all([
            import("/apps/menu-app/lib/public-menu.js"),
            import("/apps/menu-app/supabase-config.js"),
          ])
            .then(([{ fetchPublicMenu }, { SUPABASE }]) => fetchPublicMenu({ ...SUPABASE, slug: target.slug }))
            .catch(() => null);
          window.__menuEarly = { slug: target.slug, promise };
          promise.then((remote) => {
            if (remote) applyLoaderAnimation(remote.config);
          });
        }
      } catch {}
      // Si la configuración no llega, a los 10 segundos el cargador sale de "pendiente" con la animación de siempre.
      setTimeout(() => {
        const loader = document.querySelector("#loader");
        if (loader?.dataset.animacion === "pendiente") loader.dataset.animacion = "hamburguesa";
      }, 10000);
    </script>

    <button id="btn-carrito" class="btn-carrito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="2" />
        <circle cx="9" cy="20" r="1.5" fill="currentColor" />
        <circle cx="18" cy="20" r="1.5" fill="currentColor" /></svg
      ><span id="carrito-count">0</span>
    </button>

    <!-- CARRITO -->
    <div id="carrito-panel" class="carrito-panel" role="dialog" aria-modal="true" aria-label="Tu pedido" data-i18n-aria-label="cart.title" tabindex="-1">
      <div class="carrito-header">
        <h2 data-i18n="cart.title">Tu pedido</h2>
        <button id="cerrar-carrito">✕</button>
      </div>

      <div id="carrito-items"></div>

      <div class="carrito-footer">
        <p><span data-i18n="cart.total">Total</span>: <span id="carrito-total">$0</span></p>
        <button id="btn-finalizar" data-i18n="cart.send">Enviar pedido</button>
      </div>
    </div>

    <div id="overlay" class="overlay"></div>

    <!-- CHECKOUT -->
    <div id="checkout" class="checkout" role="dialog" aria-modal="true" aria-labelledby="checkout-titulo" tabindex="-1">
      <div class="checkout-header">
        <h2 id="checkout-titulo" data-i18n="checkout.title">Finalizar pedido</h2>
        <button id="cerrar-checkout" type="button" aria-label="Cerrar" data-i18n-aria-label="checkout.close">✕</button>
      </div>

      <form id="form-pedido">
        <input name="nombre" enterkeyhint="next" placeholder="Nombre y Apellido" data-i18n-placeholder="checkout.name" required />
        <!-- El teléfono se pide en todos los pedidos, con o sin envío (ENVIO-87): es cómo el local te contacta. -->
        <input name="telefono" enterkeyhint="next" type="tel" inputmode="tel" placeholder="Teléfono de contacto" data-i18n-placeholder="checkout.phone" minlength="8" maxlength="25" autocomplete="tel" required />

        <select name="entrega">
          <option disabled selected data-i18n="checkout.deliveryType">-- Tipo de entrega --</option>
          <option value="delivery" data-i18n="checkout.delivery">Delivery</option>
          <option value="retiro" data-i18n="checkout.pickup">Retiro en el local</option>
        </select>
        <p id="aviso-entrega" class="aviso-entrega" hidden></p>
        <p id="aviso-sin-envio" class="aviso-entrega" role="status" hidden></p>
        <!-- Envío con repartidor: solo con entrega "delivery" y barrios disponibles (ENVIO-20). -->
        <div id="envio-repartidor" class="envio-repartidor" hidden>
          <select name="barrio" disabled>
            <option value="" disabled selected data-i18n="checkout.zone">-- Barrio --</option>
          </select>
          <!-- Sin barrio con precio (o con "Otro barrio"): el cliente escribe el barrio y el costo se coordina (ENVIO-263). -->
          <input name="barrioTexto" enterkeyhint="next" placeholder="Escribí tu barrio" data-i18n-placeholder="checkout.zoneText" maxlength="80" autocomplete="off" hidden disabled />
          <input name="direccion" enterkeyhint="next" placeholder="Dirección (calle y número)" data-i18n-placeholder="checkout.address" minlength="5" maxlength="200" autocomplete="street-address" disabled />
          <p id="aviso-barrio" class="aviso-entrega" hidden></p>
          <p id="aviso-sin-repartidores" class="aviso-entrega aviso-sin-repartidores" role="status" hidden></p>
        </div>
        <!-- Menú de un JSON: campo de hora libre, como siempre. Con Supabase lo reemplaza #horario-programado (PUBLICO-30). -->
        <div id="horario-libre" class="horario-pedido">
          <label> <input type="checkbox" name="ahora" /> <span data-i18n="checkout.now">Ahora mismo</span> </label>
          <input name="horario" type="time" />
        </div>
        <div id="horario-programado" class="horario-pedido" hidden>
          <select name="cuando">
            <option value="asap" selected data-i18n="checkout.when.asap">Lo antes posible</option>
            <option value="schedule" data-i18n="checkout.when.schedule">Programar para una hora</option>
          </select>
          <select name="hora" hidden>
            <option value="" disabled selected data-i18n="checkout.when.pick">-- Elegí la hora --</option>
          </select>
        </div>
        <select name="pago">
          <option disabled selected data-i18n="checkout.payType">-- Tipo de pago --</option>
          <option value="efectivo" data-i18n="checkout.cash">Efectivo</option>
          <option value="transferencia" data-i18n="checkout.transfer">Transferencia</option>
          <option value="tarjeta" data-i18n="checkout.card">Credito o debito</option>
          <option value="mercadopago" data-i18n="checkout.mercadopago">Mercado Pago</option>
        </select>
        <div id="datos-transferencia" class="datos-transferencia" hidden></div>
        <textarea name="notas" enterkeyhint="done" placeholder="Notas" data-i18n-placeholder="checkout.notes"></textarea>
        <!-- Total y confirmar (PUBLICO-94): en Moderna y Minimalista quedan fijos abajo de la hoja -->
        <div class="checkout-pie">
          <p class="checkout-total"><span data-i18n="cart.total">Total</span> <span id="checkout-total" class="precio-pastilla">$0</span></p>
          <button type="submit" data-i18n="checkout.submit">Confirmar pedido</button>
        </div>
      </form>
    </div>
    <script src="/apps/menu-app/lightbox.js"></script>
    <script src="/apps/menu-app/app.js"></script>
    <!-- <script src="./app.js"></script> -->
  </body>
</html>
