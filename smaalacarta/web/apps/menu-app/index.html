<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Menú</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App instalable: app.js reemplaza estos valores por los del negocio (lib/pwa.js) -->
    <link rel="manifest" href="/api/manifest" />
    <link rel="icon" type="image/png" href="/assets/pwa/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#5a4a3a" />

    <link rel="stylesheet" href="/apps/menu-app/base.css" />
    <!-- <link rel="stylesheet" href="./base.css" /> -->
  </head>
  <body class="loading">
    <!-- LOADER -->
    <div id="loader" class="loader" role="status">
      <!-- Hamburguesa que se arma (PUBLICO-83) -->
      <svg class="loader-anim loader-hamburguesa" viewBox="0 0 120 100" aria-hidden="true">
        <g class="loader-capa loader-capa-1"><path d="M26 76h68v6a10 10 0 0 1-10 10H36a10 10 0 0 1-10-10z" fill="var(--loader-pan, #d9902f)" /></g>
        <g class="loader-capa loader-capa-2"><rect x="22" y="62" width="76" height="15" rx="7.5" fill="#5b3a29" /><path d="M30 66q4 3 8 0M52 68q4 3 8 0M76 66q4 3 8 0" stroke="#7a5239" stroke-width="2" fill="none" stroke-linecap="round" /></g>
        <g class="loader-capa loader-capa-3"><path d="M20 58q10 9 20 0t20 0 20 0 20 0v-5H20z" fill="#5fae4e" /></g>
        <g class="loader-capa loader-capa-4"><path d="M26 49h68l-8 12-10-6-12 8-12-8-10 6z" fill="#f6c343" /></g>
        <g class="loader-capa loader-capa-5"><rect x="26" y="42" width="68" height="9" rx="4.5" fill="var(--loader-acento, #e0523c)" /></g>
        <g class="loader-capa loader-capa-6">
          <path d="M24 42a36 30 0 0 1 72 0z" fill="var(--loader-pan, #d9902f)" />
          <path d="M34 30a28 22 0 0 1 14-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45" />
          <ellipse cx="50" cy="26" rx="3" ry="1.6" fill="#fff3d6" transform="rotate(-20 50 26)" /><ellipse cx="64" cy="19" rx="3" ry="1.6" fill="#fff3d6" /><ellipse cx="78" cy="27" rx="3" ry="1.6" fill="#fff3d6" transform="rotate(20 78 27)" /><ellipse cx="60" cy="32" rx="3" ry="1.6" fill="#fff3d6" transform="rotate(8 60 32)" />
        </g>
      </svg>
      <span class="loader-marca" aria-hidden="true"><span class="loader-marca-texto">SMA a la carta</span></span>
      <span class="loader-texto" data-i18n="loader.loading">Cargando…</span>
    </div>

    <!-- Tema del loader (PUBLICO-85): el último que tuvo este menú, antes de que llegue la configuración -->
    <script type="module">
      import { loaderThemeKey, savedLoaderTheme } from "/apps/menu-app/lib/theme.js";
      try {
        const key = loaderThemeKey(location.hostname, location.pathname, location.search);
        const saved = savedLoaderTheme(window.localStorage, key);
        if (saved) document.documentElement.dataset.tema = saved;
      } catch {}
    </script>

    <!-- HEADER -->
    <header class="header sticky-header">
      <div class="header-top">
        <a href="https://smaalacarta.com.ar" class="btn-volver" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24">
            <path
              d="M15 18l-6-6 6-6"
              stroke="currentColor"
              stroke-width="2"
              fill="none"
            />
          </svg>
          <span data-i18n="back">Volver</span>
        </a>
        <div class="header-status">
          <!-- SELECTOR DE IDIOMA (IDIOMA-4): lo arma app.js -->
          <div id="selector-idioma" class="selector-idioma" role="group"></div>
          <!-- SWITCH DE TEMA (solo demos, lo muestra app.js) -->
          <button
            id="btn-tema"
            class="btn-tema"
            type="button"
            aria-label="Cambiar a tema oscuro"
            hidden
          ></button>
          <button
            id="btn-buscar"
            class="btn-buscar"
            type="button"
            aria-label="Buscar..."
            aria-controls="buscador"
            aria-expanded="false"
            data-i18n-aria-label="search"
            hidden
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
          </button>
          <span class="badge-estado">
            <span class="dot"></span>
            <span id="estado-texto" data-i18n="status.open">Abierto</span>
          </span>
        </div>
      </div>
      <!-- Logo y nombre (PUBLICO-97): en Clásica no cambia nada, en Moderna y Minimalista es la tarjeta de identidad -->
      <div class="header-marca">
        <img id="logo-negocio" class="logo-negocio" alt="" width="52" height="52" hidden />
        <div class="header-titulo">
          <h1 id="nombre-negocio">...</h1>
          <p id="descripcion-negocio"></p>
          <!-- Estado y zona en una línea chica (PUBLICO-97): solo Moderna y Minimalista; la completa app.js -->
          <p id="linea-estado" class="linea-estado">
            <span class="dot"></span>
            <span id="linea-estado-texto"></span>
          </p>
        </div>
      </div>

      <!-- ZONA DE ENTREGA (PUBLICO-78): lo muestra app.js solo en locales con envío -->
      <button id="zona-chip" class="zona-chip" type="button" hidden></button>

      <!-- BUSCADOR -->
      <input
        id="buscador"
        placeholder="Buscar..."
        data-i18n-placeholder="search"
        aria-label="Buscar..."
        data-i18n-aria-label="search"
      />
    </header>

    <div id="header-sticky-title" class="header-sticky-title" aria-hidden="true" hidden>
      <span id="nombre-negocio-mini" class="header-mini-title"></span>
    </div>

    <!-- ZONA DE ENTREGA (PUBLICO-73 a 77): tarjeta que arma app.js -->
    <section id="zona-card" class="zona-card" aria-labelledby="zona-titulo" hidden></section>

    <!-- CATEGORÍAS -->
    <nav id="categorias" class="categorias sticky-categorias"></nav>

    <!-- MENÚ -->
    <main id="menu" class="menu-container"></main>

    <!-- CTA FINAL -->
    <section class="cta-section" hidden>
      <h2 data-i18n="cta.title">¿Querés este menú en tu negocio?</h2>
      <p data-i18n="cta.text">Solicita información sobre nuestro servicio de menú digital</p>
      <a
        href="https://wa.me/5493644277105?text=Hola,%20me%20interesa%20saber%20más%20sobre%20el%20menú%20digital"
        target="_blank"
        class="btn-cta"
      >
        <span data-i18n="cta.button">Solicitar información</span>
      </a>
    </section>

    <!-- BARRA DE ABAJO (PUBLICO-92): solo la muestran Moderna y Minimalista; app.js la completa -->
    <nav id="barra-app" class="barra-app" aria-label="Navegación del menú" data-i18n-aria-label="nav.label">
      <button type="button" id="barra-menu" class="barra-boton" aria-label="Menú" data-i18n-aria-label="nav.menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span data-i18n="nav.menu">Menú</span>
      </button>
      <button type="button" id="barra-promos" class="barra-boton" aria-label="Promos" data-i18n-aria-label="nav.promos" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 12l-8 8-9-9V4h7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <circle cx="8" cy="8" r="1.5" fill="currentColor" />
        </svg>
        <span data-i18n="nav.promos">Promos</span>
      </button>
      <button type="button" id="barra-carrito" class="barra-boton" aria-label="Carrito" data-i18n-aria-label="nav.cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <path d="M6 6L5 3H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="9" cy="20" r="1.5" fill="currentColor" />
          <circle cx="18" cy="20" r="1.5" fill="currentColor" />
        </svg>
        <span data-i18n="nav.cart">Carrito</span>
        <span id="barra-carrito-count" class="barra-contador" aria-hidden="true" hidden>0</span>
      </button>
    </nav>

    <!-- BOTÓN CARRITO -->
    <button id="btn-carrito" class="btn-carrito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="2" />
        <circle cx="9" cy="20" r="1.5" fill="currentColor" />
        <circle cx="18" cy="20" r="1.5" fill="currentColor" /></svg
      ><span id="carrito-count">0</span>
    </button>

    <!-- CARRITO -->
    <div id="carrito-panel" class="carrito-panel" role="dialog" aria-modal="true" aria-label="Tu pedido" data-i18n-aria-label="cart.title" tabindex="-1">
      <div class="carrito-header">
        <h2 data-i18n="cart.title">Tu pedido</h2>
        <button id="cerrar-carrito">✕</button>
      </div>

      <div id="carrito-items"></div>

      <div class="carrito-footer">
        <p><span data-i18n="cart.total">Total</span>: <span id="carrito-total">$0</span></p>
        <button id="btn-finalizar" data-i18n="cart.send">Enviar pedido</button>
      </div>
    </div>

    <div id="overlay" class="overlay"></div>

    <!-- CHECKOUT -->
    <div id="checkout" class="checkout" role="dialog" aria-modal="true" aria-labelledby="checkout-titulo" tabindex="-1">
      <div class="checkout-header">
        <h2 id="checkout-titulo" data-i18n="checkout.title">Finalizar pedido</h2>
        <button id="cerrar-checkout" type="button" aria-label="Cerrar" data-i18n-aria-label="checkout.close">✕</button>
      </div>

      <form id="form-pedido">
        <input name="nombre" placeholder="Nombre y Apellido" data-i18n-placeholder="checkout.name" required />
        <!-- El teléfono se pide en todos los pedidos, con o sin envío (ENVIO-87): es cómo el local te contacta. -->
        <input name="telefono" type="tel" inputmode="tel" placeholder="Teléfono de contacto" data-i18n-placeholder="checkout.phone" minlength="8" maxlength="25" autocomplete="tel" required />

        <select name="entrega">
          <option disabled selected data-i18n="checkout.deliveryType">-- Tipo de entrega --</option>
          <option value="delivery" data-i18n="checkout.delivery">Delivery</option>
          <option value="retiro" data-i18n="checkout.pickup">Retiro en el local</option>
        </select>
        <p id="aviso-entrega" class="aviso-entrega" hidden></p>
        <p id="aviso-sin-envio" class="aviso-entrega" role="status" hidden></p>
        <!-- Envío con repartidor: solo con entrega "delivery" y barrios disponibles (ENVIO-20). -->
        <div id="envio-repartidor" class="envio-repartidor" hidden>
          <select name="barrio" disabled>
            <option value="" disabled selected data-i18n="checkout.zone">-- Barrio --</option>
          </select>
          <input name="direccion" placeholder="Dirección (calle y número)" data-i18n-placeholder="checkout.address" minlength="5" maxlength="200" autocomplete="street-address" disabled />
          <p id="aviso-barrio" class="aviso-entrega" hidden></p>
        </div>
        <!-- Menú de un JSON: campo de hora libre, como siempre. Con Supabase lo reemplaza #horario-programado (PUBLICO-30). -->
        <div id="horario-libre" class="horario-pedido">
          <label> <input type="checkbox" name="ahora" /> <span data-i18n="checkout.now">Ahora mismo</span> </label>
          <input name="horario" type="time" />
        </div>
        <div id="horario-programado" class="horario-pedido" hidden>
          <select name="cuando">
            <option value="asap" selected data-i18n="checkout.when.asap">Lo antes posible</option>
            <option value="schedule" data-i18n="checkout.when.schedule">Programar para una hora</option>
          </select>
          <select name="hora" hidden>
            <option value="" disabled selected data-i18n="checkout.when.pick">-- Elegí la hora --</option>
          </select>
        </div>
        <select name="pago">
          <option disabled selected data-i18n="checkout.payType">-- Tipo de pago --</option>
          <option value="efectivo" data-i18n="checkout.cash">Efectivo</option>
          <option value="transferencia" data-i18n="checkout.transfer">Transferencia</option>
          <option value="tarjeta" data-i18n="checkout.card">Credito o debito</option>
          <option value="mercadopago" data-i18n="checkout.mercadopago">Mercado Pago</option>
        </select>
        <div id="datos-transferencia" class="datos-transferencia" hidden></div>
        <textarea name="notas" placeholder="Notas" data-i18n-placeholder="checkout.notes"></textarea>
        <!-- Total y confirmar (PUBLICO-94): en Moderna y Minimalista quedan fijos abajo de la hoja -->
        <div class="checkout-pie">
          <p class="checkout-total"><span data-i18n="cart.total">Total</span> <span id="checkout-total" class="precio-pastilla">$0</span></p>
          <button type="submit" data-i18n="checkout.submit">Confirmar pedido</button>
        </div>
      </form>
    </div>
    <script src="/apps/menu-app/lightbox.js"></script>
    <script src="/apps/menu-app/app.js"></script>
    <!-- <script src="./app.js"></script> -->
  </body>
</html>
