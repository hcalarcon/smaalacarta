<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Menú</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App instalable: app.js reemplaza estos valores por los del negocio (lib/pwa.js) -->
    <link rel="manifest" href="/api/manifest" />
    <link rel="icon" type="image/png" href="/assets/pwa/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#5a4a3a" />

    <link rel="stylesheet" href="/apps/menu-app/base.css" />
    <!-- <link rel="stylesheet" href="./base.css" /> -->
  </head>
  <body class="loading">
    <!-- LOADER -->
    <div id="loader" class="loader" data-variant="hamburguesa" role="status">
      <!-- Hamburguesa que se arma (PUBLICO-83) -->
      <svg class="loader-anim loader-hamburguesa" viewBox="0 0 120 100" aria-hidden="true">
        <g class="loader-capa loader-capa-1"><path d="M28 78h64v6a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8z" fill="var(--loader-pan, #d9902f)" /></g>
        <g class="loader-capa loader-capa-2"><rect x="24" y="62" width="72" height="14" rx="7" fill="#5b3a29" /></g>
        <g class="loader-capa loader-capa-3"><path d="M22 58q10 10 19 0t19 0 19 0 19 0v-4H22z" fill="#5fae4e" /></g>
        <g class="loader-capa loader-capa-4"><rect x="28" y="46" width="64" height="9" rx="4.5" fill="var(--loader-acento, #e0523c)" /></g>
        <g class="loader-capa loader-capa-5">
          <path d="M26 44a34 28 0 0 1 68 0z" fill="var(--loader-pan, #d9902f)" />
          <circle cx="46" cy="30" r="2" fill="#fff" opacity=".7" /><circle cx="62" cy="24" r="2" fill="#fff" opacity=".7" /><circle cx="76" cy="32" r="2" fill="#fff" opacity=".7" />
        </g>
      </svg>
      <!-- Plato con tapa que se levanta (PUBLICO-83) -->
      <svg class="loader-anim loader-cloche" viewBox="0 0 120 100" aria-hidden="true">
        <path class="loader-vapor loader-vapor-1" d="M44 34q-6-8 0-14t0-12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <path class="loader-vapor loader-vapor-2" d="M60 34q-6-8 0-14t0-12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <path class="loader-vapor loader-vapor-3" d="M76 34q-6-8 0-14t0-12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <g class="loader-tapa">
          <circle cx="60" cy="40" r="5" fill="var(--loader-acento, #e0523c)" />
          <path d="M20 78a40 36 0 0 1 80 0z" fill="var(--loader-pan, #d9902f)" />
          <path d="M32 70a30 26 0 0 1 22-18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55" />
        </g>
        <rect x="10" y="80" width="100" height="8" rx="4" fill="#5b3a29" />
      </svg>
      <span class="loader-texto" data-i18n="loader.loading">Cargando…</span>
    </div>
    <script type="module">
      import { loaderVariant } from "/apps/menu-app/lib/loader.js";
      document.getElementById("loader")?.setAttribute("data-variant", loaderVariant(location.search));
    </script>

    <!-- HEADER -->
    <header class="header sticky-header">
      <div class="header-top">
        <a href="https://smaalacarta.com.ar" class="btn-volver" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24">
            <path
              d="M15 18l-6-6 6-6"
              stroke="currentColor"
              stroke-width="2"
              fill="none"
            />
          </svg>
          <span data-i18n="back">Volver</span>
        </a>
        <div class="header-status">
          <!-- SELECTOR DE IDIOMA (IDIOMA-4): lo arma app.js -->
          <div id="selector-idioma" class="selector-idioma" role="group"></div>
          <!-- SWITCH DE TEMA (solo demos, lo muestra app.js) -->
          <button
            id="btn-tema"
            class="btn-tema"
            type="button"
            aria-label="Cambiar a tema oscuro"
            hidden
          ></button>
          <span class="badge-estado">
            <span class="dot"></span>
            <span id="estado-texto" data-i18n="status.open">Abierto</span>
          </span>
        </div>
      </div>
      <h1 id="nombre-negocio">...</h1>
      <p id="descripcion-negocio"></p>

      <!-- ZONA DE ENTREGA (PUBLICO-78): lo muestra app.js solo en locales con envío -->
      <button id="zona-chip" class="zona-chip" type="button" hidden></button>

      <!-- BUSCADOR -->
      <input id="buscador" placeholder="Buscar..." data-i18n-placeholder="search" />
    </header>

    <!-- ZONA DE ENTREGA (PUBLICO-73 a 77): tarjeta que arma app.js -->
    <section id="zona-card" class="zona-card" aria-labelledby="zona-titulo" hidden></section>

    <!-- CATEGORÍAS -->
    <nav id="categorias" class="categorias sticky-categorias"></nav>

    <!-- MENÚ -->
    <main id="menu" class="menu-container"></main>

    <!-- CTA FINAL -->
    <section class="cta-section" hidden>
      <h2 data-i18n="cta.title">¿Querés este menú en tu negocio?</h2>
      <p data-i18n="cta.text">Solicita información sobre nuestro servicio de menú digital</p>
      <a
        href="https://wa.me/5493644277105?text=Hola,%20me%20interesa%20saber%20más%20sobre%20el%20menú%20digital"
        target="_blank"
        class="btn-cta"
      >
        <span data-i18n="cta.button">Solicitar información</span>
      </a>
    </section>

    <!-- BOTÓN CARRITO -->
    <button id="btn-carrito" class="btn-carrito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="2" />
        <circle cx="9" cy="20" r="1.5" fill="currentColor" />
        <circle cx="18" cy="20" r="1.5" fill="currentColor" /></svg
      ><span id="carrito-count">0</span>
    </button>

    <!-- CARRITO -->
    <div id="carrito-panel" class="carrito-panel">
      <div class="carrito-header">
        <h2 data-i18n="cart.title">Tu pedido</h2>
        <button id="cerrar-carrito">✕</button>
      </div>

      <div id="carrito-items"></div>

      <div class="carrito-footer">
        <p><span data-i18n="cart.total">Total</span>: <span id="carrito-total">$0</span></p>
        <button id="btn-finalizar" data-i18n="cart.send">Enviar pedido</button>
      </div>
    </div>

    <div id="overlay" class="overlay"></div>

    <!-- CHECKOUT -->
    <div id="checkout" class="checkout">
      <div class="checkout-header">
        <h2 data-i18n="checkout.title">Finalizar pedido</h2>
        <button id="cerrar-checkout">✕</button>
      </div>

      <form id="form-pedido">
        <input name="nombre" placeholder="Nombre y Apellido" data-i18n-placeholder="checkout.name" required />
        <!-- El teléfono se pide en todos los pedidos, con o sin envío (ENVIO-87): es cómo el local te contacta. -->
        <input name="telefono" type="tel" inputmode="tel" placeholder="Teléfono de contacto" data-i18n-placeholder="checkout.phone" minlength="8" maxlength="25" autocomplete="tel" required />

        <select name="entrega">
          <option disabled selected data-i18n="checkout.deliveryType">-- Tipo de entrega --</option>
          <option value="delivery" data-i18n="checkout.delivery">Delivery</option>
          <option value="retiro" data-i18n="checkout.pickup">Retiro en el local</option>
        </select>
        <p id="aviso-entrega" class="aviso-entrega" hidden></p>
        <p id="aviso-sin-envio" class="aviso-entrega" role="status" hidden></p>
        <!-- Envío con repartidor: solo con entrega "delivery" y barrios disponibles (ENVIO-20). -->
        <div id="envio-repartidor" class="envio-repartidor" hidden>
          <select name="barrio" disabled>
            <option value="" disabled selected data-i18n="checkout.zone">-- Barrio --</option>
          </select>
          <input name="direccion" placeholder="Dirección (calle y número)" data-i18n-placeholder="checkout.address" minlength="5" maxlength="200" autocomplete="street-address" disabled />
          <p id="aviso-barrio" class="aviso-entrega" hidden></p>
        </div>
        <!-- Menú de un JSON: campo de hora libre, como siempre. Con Supabase lo reemplaza #horario-programado (PUBLICO-30). -->
        <div id="horario-libre" class="horario-pedido">
          <label> <input type="checkbox" name="ahora" /> <span data-i18n="checkout.now">Ahora mismo</span> </label>
          <input name="horario" type="time" />
        </div>
        <div id="horario-programado" class="horario-pedido" hidden>
          <select name="cuando">
            <option value="asap" selected data-i18n="checkout.when.asap">Lo antes posible</option>
            <option value="schedule" data-i18n="checkout.when.schedule">Programar para una hora</option>
          </select>
          <select name="hora" hidden>
            <option value="" disabled selected data-i18n="checkout.when.pick">-- Elegí la hora --</option>
          </select>
        </div>
        <select name="pago">
          <option disabled selected data-i18n="checkout.payType">-- Tipo de pago --</option>
          <option value="efectivo" data-i18n="checkout.cash">Efectivo</option>
          <option value="transferencia" data-i18n="checkout.transfer">Transferencia</option>
          <option value="tarjeta" data-i18n="checkout.card">Credito o debito</option>
          <option value="mercadopago" data-i18n="checkout.mercadopago">Mercado Pago</option>
        </select>
        <div id="datos-transferencia" class="datos-transferencia" hidden></div>
        <textarea name="notas" placeholder="Notas" data-i18n-placeholder="checkout.notes"></textarea>
        <button type="submit" data-i18n="checkout.submit">Confirmar pedido</button>
      </form>
    </div>
    <script src="/apps/menu-app/lightbox.js"></script>
    <script src="/apps/menu-app/app.js"></script>
    <!-- <script src="./app.js"></script> -->
  </body>
</html>
