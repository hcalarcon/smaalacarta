<!doctype html>
<html lang="es">
  <head>
    <!-- Básico -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Demo Carrito Moderno | SMA a la Carta</title>
    <meta
      name="description"
      content="Demo de carrito moderno para restaurantes. Menú digital con pedidos por WhatsApp en San Martín de los Andes."
    />

    <!-- SEO -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Carrito Moderno | SMA a la Carta" />
    <meta
      property="og:description"
      content="Explorá una demo de carrito moderno para restaurantes con menú digital y pedidos por WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://demo.smaalacarta.com.ar/carrito/modern"
    />
    <meta
      property="og:image"
      content="https://smaalacarta.com.ar/assets/demo-modern.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carrito Moderno | SMA a la Carta" />
    <meta
      name="twitter:description"
      content="Demo de carrito moderno para restaurantes con pedidos por WhatsApp."
    />
    <meta
      name="twitter:image"
      content="https://smaalacarta.com.ar/assets/demo-modern.jpg"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://smaalacarta.com.ar/assets/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://smaalacarta.com.ar/assets/favicon.svg"
    />
    <link
      rel="shortcut icon"
      href="https://smaalacarta.com.ar/assets/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://smaalacarta.com.ar/assets/apple-touch-icon.png"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body data-demo="modern">
    <!-- HEADER -->
    <header class="header">
      <div class="container header-content">
        <h1 class="logo">Don José</h1>

        <button class="cart-btn" data-open-cart>
          🛒 <span data-cart-count>0</span>
        </button>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <h2>Menú</h2>
        <p>Elegí tus platos favoritos</p>
      </div>
    </section>

    <!-- CATEGORÍAS -->
    <section class="categories">
      <div class="container" data-categories>
        <!-- render dinámico -->
      </div>
    </section>

    <!-- MENU -->
    <main class="container">
      <div class="menu-grid" data-menu>
        <!-- render dinámico -->
      </div>
    </main>

    <!-- CART DRAWER -->
    <aside class="cart" data-cart>
      <div class="cart-header">
        <h3>Tu pedido</h3>
        <button data-close-cart>✕</button>
      </div>

      <div class="cart-items" data-cart-items>
        <!-- items dinámicos -->
      </div>

      <div class="cart-footer">
        <div class="cart-total">Total: <span data-cart-total>$0</span></div>

        <button class="btn-checkout" data-checkout>Pedir por WhatsApp</button>
      </div>
    </aside>

    <!-- OVERLAY -->
    <div class="overlay" data-overlay></div>

    <!-- JS -->
    <script src="../shared/app.js"></script>
  </body>
</html>
