<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Explicativo SMA a la Carta 16x9</title>
    <link rel="stylesheet" href="marca.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="motor.js"></script>
    <style>
      #marca { left: 40px; top: 36px; font-size: 30px; z-index: 20; }
      #marca img { width: 48px; height: 48px; }
      #estados { left: 300px; top: 34px; width: 1320px; height: 60px; gap: 12px; z-index: 20; }
      .est { font-size: 26px; padding: 10px 22px; }
      #ff { right: 44px; top: 34px; width: 84px; height: 56px; z-index: 20; }
      #ff svg { width: 48px; height: 32px; }

      .etq { position: absolute; left: 0; top: 0; width: 300px; height: 36px; line-height: 36px; text-align: center; font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; z-index: 8; }
      .etq span { color: rgba(240, 242, 238, 0.6); }

      .sub { left: 60px; top: 985px; width: 1800px; height: 80px; font-size: 54px; z-index: 20; }
      .nota { left: 0; width: 1920px; top: 470px; height: 70px; z-index: 20; }
      .nota span { font-size: 36px; padding: 8px 32px; }

      .flecha { position: absolute; height: 14px; z-index: 12; }
      .linea { position: absolute; left: 0; top: 0; right: 26px; height: 14px; border-radius: 7px; background: var(--acento); }
      .punta { position: absolute; right: 0; top: -13px; width: 0; height: 0; border-left: 38px solid var(--acento); border-top: 20px solid transparent; border-bottom: 20px solid transparent; }
      .pulso { position: absolute; left: 0; top: -10px; width: 34px; height: 34px; border-radius: 50%; background: #fff3dc; box-shadow: 0 0 28px 8px rgba(217, 119, 6, 0.8); }
      .aro { position: absolute; border: 8px solid var(--acento); border-radius: 34px; box-sizing: border-box; z-index: 12; pointer-events: none; }

      .portada img { width: 128px; height: 128px; margin-bottom: 40px; }
      .portada h1 { font-size: 104px; max-width: 1500px; }
      #cierre h1 { font-size: 120px; color: var(--acento); }
      .portada .url { font-size: 56px; padding: 14px 44px; margin-top: 44px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="explicativo-h" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURACION}}">
      <div id="marca"><img src="logo.png" alt="" /><span>SMA a la Carta</span></div>
      <div id="estados">{{ESTADOS}}</div>
      <div id="ff"><svg viewBox="0 0 48 32" aria-hidden="true"><path d="M2 2 L22 16 L2 30 Z M26 2 L46 16 L26 30 Z" /></svg></div>

      {{PANES}}
      {{FLECHAS}}
      {{SUBTITULOS}}
      {{NOTAS}}

      <section id="intro" class="clip portada" data-start="0" data-duration="{{INTRO_DUR}}" data-track-index="20">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{INTRO_TITULO}}</h1>
        </div>
      </section>
      <section id="cierre" class="clip portada" data-start="{{CIERRE_INICIO}}" data-duration="{{CIERRE_DUR}}" data-track-index="21">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{CIERRE_TEXTO}}</h1>
          <div class="url">{{CIERRE_URL}}</div>
        </div>
      </section>
    </div>
    <script>
      const D = {{DATOS}};
      const tl = gsap.timeline({ paused: true });
      montarGuion(tl, D.guion);
      window.__timelines["explicativo-h"] = tl;
    </script>
  </body>
</html>
