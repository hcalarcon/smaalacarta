<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Demo SMA a la Carta 9x16</title>
    <link rel="stylesheet" href="marca.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      #marca { left: 90px; top: 96px; font-size: 38px; }
      #marca img { width: 60px; height: 60px; }

      .et {
        position: absolute;
        left: 0;
        top: 190px;
        width: 1080px;
        text-align: center;
        opacity: 0;
      }
      .et span {
        display: inline-block;
        padding: 6px 40px;
        border-radius: 999px;
        background: var(--acento);
        color: var(--fondo-1);
        font-family: var(--titulos);
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #marco { position: absolute; left: 90px; top: 290px; width: 900px; height: 1230px; opacity: 0; }
      .seg { top: 0; height: 1230px; border-radius: 30px; }
      .aro { top: 0; height: 1230px; border-radius: 30px; border: 5px solid var(--acento); box-sizing: border-box; z-index: 5; }

      .sub { left: 90px; top: 1565px; width: 900px; height: 190px; font-size: 68px; }
      .vel { right: 90px; top: 290px; width: 200px; height: 90px; }
      .vel .marca-txt { font-size: 46px; padding: 6px 28px; margin: 24px 24px 0 0; }
      .nota { left: 90px; top: 1380px; width: 900px; height: 90px; }
      .nota .marca-txt { font-size: 40px; padding: 10px 36px; }

      .portada img { width: 150px; height: 150px; margin-bottom: 50px; }
      .portada h1 { font-size: 112px; max-width: 900px; }
      #cierre h1 { font-size: 128px; color: var(--acento); }
      .portada .url { font-size: 54px; padding: 16px 48px; margin-top: 50px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="demo-9x16" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURACION}}">
      <div id="marca"><img src="logo.png" alt="" /><span>SMA a la Carta</span></div>

      <div class="et" id="et-cliente"><span>Cliente</span></div>
      <div class="et" id="et-local"><span>Local</span></div>
      <div class="et" id="et-repartidor"><span>Repartidor</span></div>

      <div id="marco">
        {{VIDEOS}}
        {{AROS}}
      </div>

      {{SUBTITULOS}}
      {{MARCAS}}

      <section id="intro" class="clip portada" data-start="0" data-duration="{{INTRO_DUR}}" data-track-index="20">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{INTRO_TITULO}}</h1>
        </div>
      </section>
      <section id="cierre" class="clip portada" data-start="{{CIERRE_INICIO}}" data-duration="{{CIERRE_DUR}}" data-track-index="21">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{CIERRE_TEXTO}}</h1>
          <div class="url">{{CIERRE_URL}}</div>
        </div>
      </section>
    </div>
    <script>
      const D = {{DATOS}};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#intro .portada-int", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.to("#intro .portada-int", { opacity: 0, duration: 0.4, ease: "power2.in" }, D.intro.dur - 0.45);
      tl.fromTo("#cierre .portada-int", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, D.cierre.inicio + 0.15);

      const entra = D.intro.dur - 0.3;
      tl.to(["#marca", "#marco"], { opacity: 1, duration: 0.5, ease: "power2.out" }, entra);
      tl.to(["#marca", "#marco"], { opacity: 0, duration: 0.3 }, D.cierre.inicio - 0.3);

      // La etiqueta de arriba cambia con quien actúa
      D.segmentos.forEach((s, i) => {
        const t = Math.max(s.inicio, entra + 0.3);
        ["cliente", "local", "repartidor"].forEach((p) => {
          tl.to("#et-" + p, { opacity: s.actor === p ? 1 : 0, duration: 0.25 }, t);
        });
        tl.fromTo("#sub-" + i + " .sub-txt", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, s.inicio + 0.05);
        tl.to("#sub-" + i + " .sub-txt", { opacity: 0, duration: 0.2 }, s.inicio + s.dur - 0.22);
        if (s.etiqueta) tl.fromTo("#vel-" + i + " .marca-txt", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, s.inicio + 0.05);
        if (s.nota) tl.fromTo("#nota-" + i + " .marca-txt", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, s.inicio + 0.05);
      });
      tl.to(".et", { opacity: 0, duration: 0.3 }, D.cierre.inicio - 0.3);

      window.__timelines["demo-9x16"] = tl;
    </script>
  </body>
</html>
