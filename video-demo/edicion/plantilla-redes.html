<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Redes SMA a la Carta 9x16</title>
    <link rel="stylesheet" href="marca.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="motor.js"></script>
    <style>
      .esc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .portada img { width: 190px; height: 190px; margin-bottom: 56px; }
      .portada h1 { font-size: 150px; max-width: 940px; color: var(--acento); }
      .portada .url { font-size: 60px; padding: 18px 52px; margin-top: 56px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="redes" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURACION}}">
      {{ESCENAS}}
      {{PASTILLAS}}
      {{TITULOS}}
      {{VIAJES}}

      <section id="cierre-redes" class="clip portada" data-start="{{CIERRE_INICIO}}" data-duration="{{CIERRE_DUR}}" data-track-index="20" style="z-index:200">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{CIERRE_TEXTO}}</h1>
          <div class="url">{{CIERRE_URL}}</div>
        </div>
      </section>
    </div>
    <script>
      const D = {{DATOS}};
      const tl = gsap.timeline({ paused: true });
      montarGuion(tl, D.guion);
      window.__timelines["redes"] = tl;
    </script>
  </body>
</html>
