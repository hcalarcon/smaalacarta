<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Demo SMA a la Carta 16x9</title>
    <link rel="stylesheet" href="marca.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      #marca { left: 40px; top: 30px; font-size: 30px; }
      #marca img { width: 48px; height: 48px; }

      .et {
        position: absolute;
        height: 44px;
        line-height: 44px;
        text-align: center;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(240, 242, 238, 0.6);
        opacity: 0;
      }
      .pane { position: absolute; opacity: 0; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
      .pane video { left: 0; top: 0; width: 100%; height: 100%; }
      .ring { position: absolute; inset: 0; border-radius: 22px; border: 5px solid var(--acento); opacity: 0; z-index: 5; pointer-events: none; }

      #et-cliente { left: 30px; top: 106px; width: 340px; }
      #pane-cliente { left: 30px; top: 150px; width: 340px; height: 736px; }
      #et-local { left: 430px; top: 143px; width: 1060px; }
      #pane-local { left: 430px; top: 187px; width: 1060px; height: 662px; }
      #et-repartidor { left: 1550px; top: 106px; width: 340px; }
      #pane-repartidor { left: 1550px; top: 150px; width: 340px; height: 736px; }

      .sub { left: 60px; top: 925px; width: 1800px; height: 120px; font-size: 56px; }
      .vel { right: 40px; top: 28px; }
      .vel .marca-txt { font-size: 40px; padding: 6px 26px; }
      .nota { left: 0; width: 1920px; top: 28px; }
      .nota .marca-txt { font-size: 34px; padding: 8px 30px; }

      .portada img { width: 128px; height: 128px; margin-bottom: 40px; }
      .portada h1 { font-size: 104px; max-width: 1500px; }
      #cierre h1 { font-size: 120px; color: var(--acento); }
      .portada .url { font-size: 56px; padding: 14px 44px; margin-top: 44px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="demo-16x9" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURACION}}">
      <div id="marca"><img src="logo.png" alt="" /><span>SMA a la Carta</span></div>

      <div class="et" id="et-cliente">Cliente</div>
      <div class="pane" id="pane-cliente">{{VIDEO_cliente}}<div class="ring"></div></div>
      <div class="et" id="et-local">Local</div>
      <div class="pane" id="pane-local">{{VIDEO_local}}<div class="ring"></div></div>
      <div class="et" id="et-repartidor">Repartidor</div>
      <div class="pane" id="pane-repartidor">{{VIDEO_repartidor}}<div class="ring"></div></div>

      {{SUBTITULOS}}
      {{MARCAS}}

      <section id="intro" class="clip portada" data-start="0" data-duration="{{INTRO_DUR}}" data-track-index="20">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{INTRO_TITULO}}</h1>
        </div>
      </section>
      <section id="cierre" class="clip portada" data-start="{{CIERRE_INICIO}}" data-duration="{{CIERRE_DUR}}" data-track-index="21">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{CIERRE_TEXTO}} · {{CIERRE_URL}}</h1>
        </div>
      </section>
    </div>
    <script>
      const D = {{DATOS}};
      const tl = gsap.timeline({ paused: true });
      const PANTALLAS = ["cliente", "local", "repartidor"];

      // Intro y cierre
      tl.fromTo("#intro .portada-int", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.to("#intro .portada-int", { opacity: 0, duration: 0.4, ease: "power2.in" }, D.intro.dur - 0.45);
      tl.fromTo("#cierre .portada-int", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, D.cierre.inicio + 0.15);

      // La escena aparece al terminar la intro y se va con el cierre
      const entra = D.intro.dur - 0.3;
      tl.to(["#marca", ".et", ".pane"], { opacity: 1, duration: 0.5, ease: "power2.out" }, entra);
      tl.to(["#marca", ".et", ".pane"], { opacity: 0, duration: 0.3 }, D.cierre.inicio - 0.3);

      // En cada tramo se destaca la pantalla de quien actúa y las otras quedan apenas atenuadas
      D.segmentos.forEach((s, i) => {
        const t = Math.max(s.inicio, entra + 0.5);
        PANTALLAS.forEach((p) => {
          const activa = s.actor === "todos" || s.actor === p;
          tl.to("#pane-" + p, { opacity: activa ? 1 : 0.4, duration: 0.35, ease: "power2.out" }, t);
          tl.to("#pane-" + p + " .ring", { opacity: s.actor === "todos" ? 0 : activa ? 1 : 0, duration: 0.35 }, t);
          tl.to("#et-" + p, { color: activa && s.actor !== "todos" ? "#d97706" : "rgba(240,242,238,0.6)", duration: 0.35 }, t);
        });
        tl.fromTo("#sub-" + i + " .sub-txt", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, s.inicio + 0.05);
        tl.to("#sub-" + i + " .sub-txt", { opacity: 0, duration: 0.2 }, s.inicio + s.dur - 0.22);
        if (s.etiqueta) tl.fromTo("#vel-" + i + " .marca-txt", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, s.inicio + 0.05);
        if (s.nota) tl.fromTo("#nota-" + i + " .marca-txt", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, s.inicio + 0.05);
      });

      window.__timelines["demo-16x9"] = tl;
    </script>
  </body>
</html>
