<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Explicativo SMA a la Carta 9x16</title>
    <link rel="stylesheet" href="marca.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="motor.js"></script>
    <style>
      #marca { left: 70px; top: 50px; font-size: 34px; z-index: 20; }
      #marca img { width: 54px; height: 54px; }
      #estados { left: 70px; top: 126px; width: 940px; height: 56px; gap: 8px; z-index: 20; }
      .est { font-size: 21px; padding: 9px 14px; }
      #ff { left: 906px; top: 330px; width: 90px; height: 58px; z-index: 20; }
      #ff svg { width: 50px; height: 33px; }

      .etq { position: absolute; left: 0; top: 232px; width: 1080px; text-align: center; z-index: 20; }
      .etq span { display: inline-block; padding: 4px 38px; border-radius: 999px; background: var(--acento); color: var(--fondo-1); font-family: var(--titulos); font-weight: 800; font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; }

      .sub { left: 70px; top: 1590px; width: 940px; height: 200px; font-size: 64px; z-index: 20; }
      .nota { left: 70px; top: 1440px; width: 940px; height: 80px; z-index: 20; }
      .nota span { font-size: 40px; padding: 10px 34px; }

      .portada img { width: 150px; height: 150px; margin-bottom: 50px; }
      .portada h1 { font-size: 112px; max-width: 900px; }
      #cierre h1 { font-size: 128px; color: var(--acento); }
      .portada .url { font-size: 54px; padding: 16px 48px; margin-top: 50px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="explicativo-v" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURACION}}">
      <div id="marca"><img src="logo.png" alt="" /><span>SMA a la Carta</span></div>
      <div id="estados">{{ESTADOS}}</div>
      <div id="ff"><svg viewBox="0 0 48 32" aria-hidden="true"><path d="M2 2 L22 16 L2 30 Z M26 2 L46 16 L26 30 Z" /></svg></div>

      {{PANES}}
      {{SUBTITULOS}}
      {{NOTAS}}

      <section id="intro" class="clip portada" data-start="0" data-duration="{{INTRO_DUR}}" data-track-index="20">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{INTRO_TITULO}}</h1>
        </div>
      </section>
      <section id="cierre" class="clip portada" data-start="{{CIERRE_INICIO}}" data-duration="{{CIERRE_DUR}}" data-track-index="21">
        <div class="portada-int">
          <img src="logo.png" alt="" />
          <h1>{{CIERRE_TEXTO}}</h1>
          <div class="url">{{CIERRE_URL}}</div>
        </div>
      </section>
    </div>
    <script>
      const D = {{DATOS}};
      const tl = gsap.timeline({ paused: true });
      montarGuion(tl, D.guion);
      window.__timelines["explicativo-v"] = tl;
    </script>
  </body>
</html>
